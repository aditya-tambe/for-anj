<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts for You</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f8ff;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    background-color: #fff;
    border-radius: 10px;
    width: 80%;
    max-width: 600px;
}

button {
    font-size: 20px;
    padding: 10px 20px;
    margin: 20px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
    background-color: #32cd32;
    color: white;
}

.cute-text .main-text {
    font-size: 24px;
    color: #ff69b4;
    margin-bottom: 20px;
}

.cute-text .sub-text {
    font-size: 20px;
    color: #333;
    margin: 10px 0;
}

.cute-text .redeem-text {
    font-size: 18px;
    color: #ff4500;
    margin-top: 20px;
}

    </style>
</head>
<body>
    <div class="container cute-text">
        <p class="main-text">you get 3 gifts for being my girlfriend</p>
        <p class="sub-text">a movie and tv show watchlist from me</p>
        <p class="sub-text">a para</p>
        <p class="sub-text">and a lovemaking coupon</p>
        <p class="redeem-text">to redeem these gifts please download the 3 in one coupon from the button below</p>
        <button id="download">Download Coupon</button>
    </div>
    <script>
        document.getElementById('download').addEventListener('click', () => {
            window.location.href = 'coupon.pdf'; // Make sure to have a file named 'coupon.pdf' in the same directory
        });
    </script>
</body>
</html>
